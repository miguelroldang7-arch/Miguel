name: Pruebas TicketFix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descargar JUnit 4 y Hamcrest
        run: |
          mkdir -p lib
          curl -sL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o lib/junit-4.13.2.jar
          curl -sL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o lib/hamcrest-core-1.3.jar

      - name: Etapa 1 - Compilar version sin correccion
        run: |
          mkdir -p out_sin_correccion
          javac -encoding UTF-8 -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" -d out_sin_correccion \
            $(find ticketfix -name "*.java" ! -name "NotificadorTicket.java") \
            pruebas/sin_correccion/ticketfix/notificacion/NotificadorTicket.java \
            $(find pruebas/ticketfix/notificacion -maxdepth 1 -name "*.java")

      - name: Etapa 1 - Ejecutar pruebas (fallos esperados)
        continue-on-error: true
        run: |
          java -cp "out_sin_correccion:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore ticketfix.notificacion.NotificadorTicketTest

      - name: Etapa 2 - Compilar version corregida
        run: |
          mkdir -p out_corregida
          javac -encoding UTF-8 -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" -d out_corregida \
            $(find ticketfix -name "*.java") \
            $(find pruebas/ticketfix/notificacion -maxdepth 1 -name "*.java")

      - name: Etapa 2 - Ejecutar pruebas (validacion final)
        run: |
          java -cp "out_corregida:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore ticketfix.notificacion.NotificadorTicketTest
