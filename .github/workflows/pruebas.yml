name: Pruebas TicketFix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descargar JUnit 4 y Hamcrest
        run: |
          mkdir -p lib
          curl -sL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o lib/junit-4.13.2.jar
          curl -sL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o lib/hamcrest-core-1.3.jar

      - name: Compilar codigo y pruebas
        run: |
          mkdir -p out
          javac -encoding UTF-8 -cp "lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" -d out $(find ticketfix pruebas -name "*.java" 2>/dev/null)

      - name: Ejecutar pruebas con JUnit 4
        run: |
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -cp "out:lib/junit-4.13.2.jar:lib/hamcrest-core-1.3.jar" org.junit.runner.JUnitCore ticketfix.notificacion.NotificadorTicketTest
