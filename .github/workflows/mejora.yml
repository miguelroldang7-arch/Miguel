name: Validacion mejora evolutiva TicketFix

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validacion:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Descargar JUnit 4 y Hamcrest
        run: |
          mkdir -p lib
          curl -sL https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o lib/junit-4.13.2.jar
          curl -sL https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o lib/hamcrest-core.1.3.jar

      - name: Compilar version mejorada (con Canal)
        run: |
          mkdir -p out_mejora
          javac -encoding UTF-8 -cp "lib/junit-4.13.2.jar:lib/hamcrest-core.1.3.jar" -d out_mejora \
            $(find ticketfix -name "*.java") \
            $(find pruebas/ticketfix/notificacion pruebas/mejora/ticketfix/notificacion -maxdepth 1 -name "*.java")

      - name: Pruebas de regresion (5 originales) y de la mejora (4 nuevas)
        run: |
          java -cp "out_mejora:lib/junit-4.13.2.jar:lib/hamcrest-core.1.3.jar" org.junit.runner.JUnitCore ticketfix.notificacion.NotificadorTicketTest ticketfix.notificacion.CanalTest

      - name: Ejecutar Main refactorizado
        run: |
          java -cp out_mejora ticketfix.notificacion.MainNotificacion
