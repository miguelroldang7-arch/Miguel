name: Validacion mejora evolutiva TicketFix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validacion:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar clases y pruebas
        run: |
          mkdir -p out/main out/test
          javac -d out/main $(find ticketfix -name "*.java")
          javac -d out/test -cp out/main $(find . -path "*test*" -name "*.java")

      - name: Pruebas de regresion (5 originales) y de la mejora (4 nuevas)
        run: |
          java -cp out/main:out/test RunnerPruebasTicketFix

      - name: Ejecutar Main refactorizado
        run: |
          java -cp out/main ticketfix.notificacion.Main
